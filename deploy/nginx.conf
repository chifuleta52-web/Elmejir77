# /etc/nginx/sites-available/futbol.matiaspendino.com
# Después de copiarlo:  sudo ln -s /etc/nginx/sites-available/futbol.matiaspendino.com /etc/nginx/sites-enabled/
#                       sudo nginx -t && sudo systemctl reload nginx
#                       sudo certbot --nginx -d futbol.matiaspendino.com
server {
    listen 80;
    listen [::]:80;
    server_name futbol.matiaspendino.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
